name: Integration
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilaf
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: pilaf
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pilaf:ci_only_password@localhost:5432/pilaf
      APP_ORIGIN: http://localhost:3000
      ACCOUNTS_ENABLED: 'false'
      WHOLESALE_ENABLED: 'false'
      TEST_CHECKOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run migrate && npm run migrate
      - run: npm run build
      - run: |
          npm start > /tmp/pilaf.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          npm run smoke
      - if: failure()
        run: cat /tmp/pilaf.log || true
